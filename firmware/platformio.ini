; PlatformIO project configuration for ESPx
; Supports multiple ESP32 board variants
; See https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
default_envs = esp32dev

; ──────────────────────────────────────────────────────────────────
; Shared settings
; ──────────────────────────────────────────────────────────────────
[env_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
build_flags =
    -DCORE_DEBUG_LEVEL=0

; ──────────────────────────────────────────────────────────────────
; Generic ESP32 dev board (most breakout boards)
; ──────────────────────────────────────────────────────────────────
[env:esp32dev]
extends = env_base
board = esp32dev

; ──────────────────────────────────────────────────────────────────
; LilyGo T-Display (ESP32 with built-in 1.14" TFT)
; ──────────────────────────────────────────────────────────────────
[env:lilygo-t-display]
extends = env_base
board = lilygo-t-display
build_flags =
    ${env_base.build_flags}
    -DLILYGO_T_DISPLAY=1

; ──────────────────────────────────────────────────────────────────
; ESP32-S3 DevKit
; ──────────────────────────────────────────────────────────────────
[env:esp32s3]
extends = env_base
board = esp32-s3-devkitc-1
build_flags =
    ${env_base.build_flags}
    -DESP32S3=1
