[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "espx"
version = "1.0.0"
description = "Full ESP32/ESP8266 wireless suite with ESPiritAi orchestration"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
huggingface = ["transformers>=4.30", "torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
